name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签，例如 v0.2.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<9'
      - name: Verify packages
        run: python -m pytest logic-pro-arranger/tests/test_package.py -q
      - name: Verify MIDI tools
        if: matrix.python == '3.11'
        run: python -m pytest logic-pro-arranger/tests/test_midi.py -q

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build versioned packages and checksums
        run: python package_skill.py --release "$RELEASE_TAG" --out dist/release
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" == false ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" \
              --title "Logic Pro Arranger $RELEASE_TAG" --notes-file dist/release/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.plugin dist/release/*.zip dist/release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
